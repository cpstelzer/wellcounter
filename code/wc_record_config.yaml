# Configuration for wc_record_experiment.py

# --- File Paths ---
paths:
  # Base directory where all the well-specific folders will be created.
  output_folder_base: "C:/wellcounter/popgrowth_20251001/"
  
  # Name of the detailed metadata log file created inside each well's folder.
  log_filename: "metadata_log.csv"
  
  # Name of the high-level summary log for the entire experiment.
  experiment_summary_log_filename: "experiment_summary_log.csv"

# --- Acquisition Parameters ---
acquisition:
  # Duration of the image sequence recording for each well (in seconds).
  duration_sec: 7
  
  # Target frames per second for the camera.
  fps: 25.0
  
  # Camera exposure time in microseconds.
  exposure_us: 15000

# --- Output Settings ---
output:
  save_mode: sample3     # options: "full" (save all frames) | "sample3" (first, middle, last)
  image_format: png      # enforced as png for reference frames
  png_compression: 1     # 0-9 (lower = faster, larger files)
  save_jpg: true         # if true, save all frames also as JPEG
  jpg_quality: 85        # JPEG quality (1–100, higher = better/larger)
  jpg_subfolder: jpg     # subfolder name for JPEG export