motion:
  analysis_duration: 0.5 # Duration in seconds for motion analysis
  max_search_distance: 20
  min_trajectory_size: 5
  trajectory_random_colors: false
optimize:
  area_from: 150
  area_step: 50
  area_to: 400
  output_folder: C:/wellcounter/training_data_for_MEE
  threshold_from: 8
  threshold_step: 8
  threshold_to: 24
  training_path: C:/wellcounter/training_data_for_MEE
outputs:
  motion: true
  particle_detection: true
particle_detection:
  background_is_dark: true
  default_particle_area: 500
  filter_by_shape: true
  microorganism_blur: 5
  microorganism_threshold: 24
  min_microorganism_area: 210
  search_radius_factor: 2
  unsubtracted_threshold: 70
system:
  image_height_px: 4504
  image_width_px: 4504
wellplate:
  auto_center_mask: true # Automatically detect center of the well
  create_mask: true # Mask out areas outside the well
  perfect_circle: true
  radius_px: 2200 # Expected radius of the well in pixels
  # Defines the acceptable deviation for the detected well radius from 'radius_px'.
  # If the detected radius is outside this percentage, the system will fall back
  # to using the geometric center of the image.
  radius_tolerance_percent: 10
  type: 6 # Wellplate type (e.g., 6 for 6-well plate)

